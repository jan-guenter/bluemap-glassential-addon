name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out add-on
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Check out exact BlueMap backport
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jan-guenter/BlueMap
          ref: 7e07f4e74ec1e92a6ead9aa1e66054af3e133aac
          path: .ci/bluemap
          submodules: recursive
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Set up Gradle 9.6.1
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          gradle-version: '9.6.1'
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Acquire exact ephemeral runtime input
        run: |
          input_dir="${RUNNER_TEMP}/glassential"
          mkdir -p "${input_dir}"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/Glassential-renewed-1.21.1-3.4.5.jar" \
            "https://cdn.modrinth.com/data/kc9FSsYx/versions/ZU9ErRM9/Glassential-renewed-1.21.1-3.4.5.jar"
          curl --fail --location --retry 3 --retry-all-errors \
            --output "${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar" \
            "https://cdn.modrinth.com/data/p19vrgc2/versions/6Oxgpgr9/fusion-1.3.12-neoforge-mc1.21.1.jar"
          test "$(stat -c %s "${input_dir}/Glassential-renewed-1.21.1-3.4.5.jar")" \
            -eq 702249
          test "$(stat -c %s "${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar")" \
            -eq 923270
          (
            cd "${input_dir}"
            sha256sum --check <<'SHA256SUMS'
          1f0c8f7533bf3b2002575219ba795fd32a44cc5085c2710624ebbf69e6121471  Glassential-renewed-1.21.1-3.4.5.jar
          17f5215648a98bcde4134577b013200dbf363273ae282449c51408ae8346f2fa  fusion-1.3.12-neoforge-mc1.21.1.jar
          SHA256SUMS
          )

      - name: Run the exact migration-candidate gate
        run: |
          input_dir="${RUNNER_TEMP}/glassential"
          python3 gallery/generate.py --check \
            --glassential-jar="${input_dir}/Glassential-renewed-1.21.1-3.4.5.jar" \
            --fusion-jar="${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar"
          python3 -m json.tool provenance/upstreams.json >/dev/null
          (cd gallery && sha256sum --check SHA256SUMS)
          python3 -m unittest discover -s tools/tests -p 'test_*.py'
          python3 -m unittest discover -s gallery/tests -p 'test_*.py'
          gradle --no-daemon \
            -PbluemapSourcePath=.ci/bluemap \
            -PglassentialJar="${input_dir}/Glassential-renewed-1.21.1-3.4.5.jar" \
            -PfusionJar="${input_dir}/fusion-1.3.12-neoforge-mc1.21.1.jar" \
            clean prototypeCheck build generatePomFileForAddonPublication \
            generateMetadataFileForAddonPublication

      - name: Upload review outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bluemap-glassential-${{ github.sha }}
          path: |
            build/libs/*.jar
            build/publications/addon/pom-default.xml
            build/publications/addon/module.json
            build/reports/**
          if-no-files-found: error
          retention-days: 14
