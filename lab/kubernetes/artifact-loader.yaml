apiVersion: v1
kind: Pod
metadata:
  name: glassential-artifact-loader
  namespace: bluemap-sophisticated-staging
  labels:
    app.kubernetes.io/name: glassential-artifact-loader
    app.kubernetes.io/part-of: bluemap-sophisticated-staging
    app.kubernetes.io/component: glassential
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  terminationGracePeriodSeconds: 5
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: loader
      image: busybox@sha256:9532d8c39891ca2ecde4d30d7710e01fb739c87a8b9299685c63704296b16028
      env:
        - name: SERVER_SIZE
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: server-archive-size } }
        - name: SERVER_SHA256
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: server-archive-sha256 } }
        - name: BLUEMAP_SIZE
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: bluemap-size } }
        - name: BLUEMAP_SHA256
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: bluemap-sha256 } }
        - name: GLASSENTIAL_SIZE
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: glassential-size } }
        - name: GLASSENTIAL_SHA256
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: glassential-sha256 } }
        - name: FUSION_SIZE
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: fusion-size } }
        - name: FUSION_SHA256
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: fusion-sha256 } }
        - name: ADDON_SIZE
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: addon-size } }
        - name: ADDON_SHA256
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: addon-sha256 } }
        - name: GALLERY_SIZE
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: gallery-size } }
        - name: GALLERY_SHA256
          valueFrom: { configMapKeyRef: { name: bluemap-glassential-staging-pins, key: gallery-sha256 } }
      command:
        - sh
        - -eu
        - -c
        - |
          artifact_dir=/data/.bluemap-sophisticated-staging
          mkdir -p "${artifact_dir}"
          rm -f "${artifact_dir}/.glassential-upload-complete" \
            "${artifact_dir}/.glassential-artifacts-verified"
          printf 'READY_FOR_UPLOAD\n'

          remaining=1800
          while [ ! -e "${artifact_dir}/.glassential-upload-complete" ]; do
            if [ "${remaining}" -le 0 ]; then
              printf 'Timed out waiting for the atomic upload marker.\n' >&2
              exit 1
            fi
            remaining=$((remaining - 2))
            sleep 2
          done

          server="${artifact_dir}/ServerFiles-1.2.0.zip"
          bluemap="${artifact_dir}/bluemap.jar"
          addon="${artifact_dir}/bluemap-glassential-addon-0.1.0-alpha.1.jar"
          gallery="${artifact_dir}/bluemap-glassential-gallery-atmons-1.2.0.zip"
          glassential=/data/mods/Glassential-renewed-1.21.1-3.4.5.jar
          fusion=/data/mods/fusion-1.3.12-neoforge-mc1.21.1.jar

          case "${ADDON_SIZE}:${ADDON_SHA256}" in
            *PENDING*) printf 'Candidate pins are still pending.\n' >&2; exit 1 ;;
          esac
          for specification in \
            "${SERVER_SIZE}:${SERVER_SHA256}:${server}" \
            "${BLUEMAP_SIZE}:${BLUEMAP_SHA256}:${bluemap}" \
            "${GLASSENTIAL_SIZE}:${GLASSENTIAL_SHA256}:${glassential}" \
            "${FUSION_SIZE}:${FUSION_SHA256}:${fusion}" \
            "${ADDON_SIZE}:${ADDON_SHA256}:${addon}" \
            "${GALLERY_SIZE}:${GALLERY_SHA256}:${gallery}"
          do
            size=${specification%%:*}
            remainder=${specification#*:}
            digest=${remainder%%:*}
            file=${remainder#*:}
            test "$(stat -c %s "${file}")" -eq "${size}"
            printf '%s  %s\n' "${digest}" "${file}" | sha256sum -c -
          done
          chmod 0444 "${server}" "${bluemap}" "${addon}" "${gallery}"
          printf '%s %s %s\n' \
            "$(basename "${addon}")" "${ADDON_SIZE}" "${ADDON_SHA256}" \
            "$(basename "${gallery}")" "${GALLERY_SIZE}" "${GALLERY_SHA256}" \
            "$(basename "${glassential}")" "${GLASSENTIAL_SIZE}" "${GLASSENTIAL_SHA256}" \
            "$(basename "${fusion}")" "${FUSION_SIZE}" "${FUSION_SHA256}" \
            > "${artifact_dir}/.glassential-artifacts-verified"
          printf 'LOCAL_ARTIFACTS_VERIFIED\n'
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 128Mi
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: data
