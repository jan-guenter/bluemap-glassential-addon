apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  namespace: bluemap-sophisticated-staging
spec:
  replicas: 0
  template:
    metadata:
      annotations:
        bluemap.guenter.cloud/addon-sha256: null
        bluemap.guenter.cloud/glassential-mode: null
    spec:
      containers:
        - name: minecraft
          env:
            - name: BLUEMAP_GLASSENTIAL_DISABLED_PROFILES
              $patch: delete
      initContainers:
        - name: install-local-artifacts
          args:
            - |
              addon=/data/config/bluemap/packs/bluemap-glassential-addon-0.1.0-alpha.1.jar
              glassential=/data/mods/Glassential-renewed-1.21.1-3.4.5.jar
              fusion=/data/mods/fusion-1.3.12-neoforge-mc1.21.1.jar
              rm -f -- "${addon}" \
                /data/config/bluemap/packs/zz-0246-glassential.zip \
                /data/config/bluemap/packs/zz-0049-fusion.zip
              rm -rf -- /data/bluemap/web/maps/glassential_staging
              test ! -e "${addon}"
              test ! -e /data/config/bluemap/packs/zz-0246-glassential.zip
              test ! -e /data/config/bluemap/packs/zz-0049-fusion.zip
              printf '%s  %s\n' \
                '1f0c8f7533bf3b2002575219ba795fd32a44cc5085c2710624ebbf69e6121471' "${glassential}" \
                '17f5215648a98bcde4134577b013200dbf363273ae282449c51408ae8346f2fa' "${fusion}" \
                | sha256sum -c -
              printf 'GLASSENTIAL_ADDON_REMOVED\n'
